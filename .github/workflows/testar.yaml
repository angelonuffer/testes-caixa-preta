name: Testar

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Instalar Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Executar testes
      run: nix run -f testar.nix -L

    - name: Upload servidor.log
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: servidor-log
        path: testes/servidor.log

    - name: Upload capturas de tela em caso de falha
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: telas
        path: testes/telas/
        retention-days: 7
