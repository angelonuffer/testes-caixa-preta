- cenário: "Acesso ao site exemplo"
  navegação:
    - endereço: "testes/exemplo.html"
      arquivo: "exemplo.png"
- cenário: "Envio de formulário e IndexedDB"
  navegação:
    - endereço: "testes/formulario.html"
      arquivo: "formulario_salvo.png"
      formulário:
        nome: "Fulano de Tal"
      esperar: "document.getElementById('status') && document.getElementById('status').textContent.includes('Salvo com sucesso')"
    - endereço: "testes/exibicao.html"
      arquivo: "exibicao_dados.png"
      esperar: "document.getElementById('resultado') && !document.getElementById('resultado').textContent.includes('Carregando')"